  <rect x="40.5" y="19" width="4.5" height="19" rx="2.25" fill="url(#voxGrad)" />
  <rect x="47.5" y="13" width="4.5" height="17" rx="2.25" fill="url(#voxGrad)" />

  <!-- Vertex Authenticity Focus Node -->
